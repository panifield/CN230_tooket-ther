<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOKET-THER | Payment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header>
        <div class="container nav-content">
            <a href="{{ url_for('root') }}" class="logo">
                <div class="logo-icon gradient-coastal">
                    <i data-lucide="ticket"></i>
                </div>
                <span class="logo-text">TOOKET-THER</span>
            </a>
            <nav class="nav-links">
                <!-- Links if needed -->
            </nav>
            <div class="nav-actions">
                <button class="btn-secondary" onclick="logout()">LOGOUT</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 80px; padding-bottom: 80px;">
        <a href="{{ url_for('book_now') }}" class="nav-link mb-8" style="display: inline-flex; align-items: center; gap: 8px;">
            <i data-lucide="arrow-left" size="14"></i> BACK TO SEAT SELECTION
        </a>

        <div class="grid" style="grid-template-columns: 3fr 2fr;">
            <div>
                <h1 style="font-size: 32px; font-weight: 500; letter-spacing: -0.05em; margin-bottom: 48px;">Secure Checkout</h1>

                <div class="card-coastal" style="padding: 32px;">
                    <div class="mb-12">
                        <span class="mono-label" style="color: var(--brand-blue); margin-bottom: 16px; display: block;">PAYMENT METHOD</span>
                        <div class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 16px;">
                            <div class="card-coastal" style="padding: 16px; text-align: center; border-color: var(--brand-blue); background: rgba(170, 214, 250, 0.1);">
                                <i data-lucide="credit-card" size="24" style="margin-bottom: 8px;"></i>
                                <div class="mono-label" style="font-size: 10px;">CARD</div>
                            </div>
                            <div class="card-coastal" style="padding: 16px; text-align: center; opacity: 0.5;">
                                <i data-lucide="wallet" size="24" style="margin-bottom: 8px;"></i>
                                <div class="mono-label" style="font-size: 10px;">WALLET</div>
                            </div>
                            <div class="card-coastal" style="padding: 16px; text-align: center; opacity: 0.5;">
                                <i data-lucide="landmark" size="24" style="margin-bottom: 8px;"></i>
                                <div class="mono-label" style="font-size: 10px;">BANK</div>
                            </div>
                        </div>
                    </div>

                    <form id="payment-form" onsubmit="processPayment(event)">
                        <div class="form-group">
                            <label>CARDHOLDER NAME</label>
                            <input type="text" required placeholder="NAME AS IT APPEARS ON CARD">
                        </div>
                        <div class="form-group">
                            <label>CARD NUMBER</label>
                            <div style="position: relative;">
                                <input type="text" required placeholder="0000 0000 0000 0000">
                                <i data-lucide="shield-check" style="position: absolute; right: 12px; top: 12px; color: rgba(1, 1, 32, 0.2);" size="16"></i>
                            </div>
                        </div>
                        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 24px;">
                            <div class="form-group">
                                <label>EXPIRY DATE</label>
                                <input type="text" required placeholder="MM / YY">
                            </div>
                            <div class="form-group">
                                <label>CVV / CVC</label>
                                <input type="text" required placeholder="000">
                            </div>
                        </div>

                        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 24px;">
                            <i data-lucide="shield-check"></i> CONFIRM PAYMENT
                        </button>
                    </form>
                </div>
            </div>

            <div>
                <div class="card-coastal" style="padding: 32px; background: rgba(252, 230, 169, 0.05); border: none;">
                    <h3 class="mono-label" style="color: var(--brand-blue); margin-bottom: 32px;">ORDER DETAILS</h3>
                    
                    <div class="flex gap-4 mb-8">
                        <div style="width: 64px; height: 64px; border-radius: var(--radius-sharp); overflow: hidden;">
                            <img src="https://picsum.photos/seed/tech/100/100" style="width: 100%; height: 100%; object-fit: cover;" referrerPolicy="no-referrer">
                        </div>
                        <div>
                            <h4 style="font-size: 16px; font-weight: 500;">Coastal Tech Summit 2026</h4>
                            <p class="mono-label" style="font-size: 9px; color: rgba(1, 1, 32, 0.4); margin-top: 4px;">MAY 12, 2026 • MAIN AUDITORIUM</p>
                        </div>
                    </div>

                    <div style="border-top: 1px solid rgba(1, 1, 32, 0.05); padding-top: 24px;">
                        <div class="flex justify-between mb-4" style="font-size: 14px; color: rgba(1, 1, 32, 0.6);">
                            <span id="seat-count-display">Seats (0)</span>
                            <span id="subtotal-display">$0.00</span>
                        </div>
                        <div class="flex justify-between pt-4" style="border-top: 1px solid rgba(1, 1, 32, 0.1); font-size: 20px; font-weight: 500;">
                            <span>Total Amount</span>
                            <span id="total-display">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        lucide.createIcons();
        
        const count = parseInt(localStorage.getItem('selectedSeatsCount') || '0');
        const subtotal = count * 150;
        const total = subtotal + (count > 0 ? 15 : 0);
        
        document.getElementById('seat-count-display').innerText = `Seats (${count})`;
        document.getElementById('subtotal-display').innerText = `$${subtotal.toFixed(2)}`;
        document.getElementById('total-display').innerText = `$${total.toFixed(2)}`;

        function processPayment(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" class="animate-spin"></i> PROCESSING...';
            lucide.createIcons();
            
            setTimeout(() => {
                window.location.href = '{{ url_for("post_purchase") }}';
            }, 2000);
        }
    </script>
</body>
</html>
