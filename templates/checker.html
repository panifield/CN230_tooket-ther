<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOKET-THER | Ticket Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header>
        <div class="container nav-content">
            <a href="{{ url_for('root') }}" class="logo">
                <div class="logo-icon gradient-coastal">
                    <i data-lucide="ticket"></i>
                </div>
                <span class="logo-text">TOOKET-THER</span>
            </a>
            <nav class="nav-links">
                <a href="{{ url_for('root') }}" class="nav-link">Home</a>
                <a href="{{ url_for('checker') }}" class="nav-link active">Checker</a>
            </nav>
            <div class="nav-actions">
                <button class="btn-secondary" onclick="logout()">LOGOUT</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 120px; padding-bottom: 80px; max-width: 500px;">
        <div class="text-center mb-12">
            <div class="logo-icon gradient-coastal" style="width: 80px; height: 80px; margin: 0 auto 24px;">
                <i data-lucide="scan-line" size="40"></i>
            </div>
            <h1 style="font-size: 32px; font-weight: 500; letter-spacing: -0.05em;">Ticket Verification</h1>
            <p style="font-size: 14px; color: rgba(1, 1, 32, 0.6);">Scan QR code or enter ticket ID manually.</p>
        </div>

        <div class="card-coastal" style="padding: 32px;">
            <div class="form-group">
                <label>TICKET ID / SERIAL</label>
                <input type="text" id="ticket-id" placeholder="TKT-0000-XX">
            </div>
            <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="checkTicket()">
                VERIFY TICKET
            </button>
        </div>

        <div id="result" class="hidden mt-8 card-coastal" style="padding: 24px; text-align: center;">
            <div id="result-icon" style="width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;"></div>
            <h3 id="result-title" style="font-weight: 600; margin-bottom: 4px;"></h3>
            <p id="result-msg" style="font-size: 12px; color: rgba(1, 1, 32, 0.6);"></p>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        lucide.createIcons();
        function checkTicket() {
            const id = document.getElementById('ticket-id').value;
            const result = document.getElementById('result');
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-msg');

            result.classList.remove('hidden');
            
            if (id.length > 5) {
                icon.style.background = '#ECFDF5';
                icon.style.color = '#059669';
                icon.innerHTML = '<i data-lucide="check-circle"></i>';
                title.innerText = 'VALID TICKET';
                msg.innerText = 'Coastal Tech Summit 2026 • Seat A12';
            } else {
                icon.style.background = '#FEF2F2';
                icon.style.color = '#DC2626';
                icon.innerHTML = '<i data-lucide="x-circle"></i>';
                title.innerText = 'INVALID TICKET';
                msg.innerText = 'Ticket ID not found in database.';
            }
            lucide.createIcons();
        }
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
